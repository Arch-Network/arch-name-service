[package]
name = "ans-fixtures"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Export deterministic ANS protocol fixtures for TypeScript parity tests"

[[bin]]
name = "ans-fixtures"
path = "src/main.rs"

[dependencies]
ans-protocol = { path = "../../crates/ans-protocol" }
borsh = "=1.5.3"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
